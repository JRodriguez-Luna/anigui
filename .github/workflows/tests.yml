name: tests

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

# Read-only: tests never need to change the repository.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      # ani-cli 5.1.6, the version AniGUI's parser is verified against
      ANI_CLI_COMMIT: 0301d67d5768d332b049821a30082ad43d9a215a
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install ani-cli (pinned)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://raw.githubusercontent.com/pystardust/ani-cli/$ANI_CLI_COMMIT/ani-cli" -o "$HOME/.local/bin/ani-cli"
          chmod +x "$HOME/.local/bin/ani-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Probe stills for this season (temporary)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          python - <<'PY'
          import collections
          from core.anilist import AniListClient
          from core.stills import EpisodeStills
          al = AniListClient(); src = EpisodeStills(al)
          shows = al.season("FALL", 2026, per_page=30)
          total = got = 0; none = []; lines = []
          for m in shows:
              aired = (m.next_episode - 1) if m.next_episode else (m.episodes or 0)
              if aired <= 0:
                  continue
              found = src.for_episodes(m.anilist_id, m.mal_id, [(str(i), None) for i in range(1, aired + 1)])
              hosts = collections.Counter(u.split("/")[2] for u in found.values())
              total += aired; got += len(found)
              if not found: none.append(m.display_title[:30])
              lines.append(f"{m.display_title[:28]} {len(found)}/{aired} {dict(hosts)}")
          print(f"::notice title=season summary::{len(lines)} shows, {got}/{total} aired episodes have pictures; none at all: {none}")
          for i in range(0, len(lines), 8):
              print("::notice title=season " + str(i // 8) + "::" + " | ".join(lines[i:i + 8]))
          PY

      - name: Run tests (offline; fake site, fake mpv, real ani-cli)
        run: pytest -q

      - name: Known vulnerabilities in dependencies
        if: runner.os == 'Linux'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
