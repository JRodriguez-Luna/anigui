name: tests

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

# Read-only: tests never need to change the repository.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      # ani-cli 5.1.6, the version AniGUI's parser is verified against
      ANI_CLI_COMMIT: 0301d67d5768d332b049821a30082ad43d9a215a
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install ani-cli (pinned)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://raw.githubusercontent.com/pystardust/ani-cli/$ANI_CLI_COMMIT/ani-cli" -o "$HOME/.local/bin/ani-cli"
          chmod +x "$HOME/.local/bin/ani-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Probe filler sources (temporary)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: python
        run: |
          import re, urllib.request
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "AniGUI/1.7"}), timeout=30).read().decode("utf-8", "replace")
          h = get("https://www.animefillerlist.com/shows/naruto")
          rows = re.findall(r"<tr[^>]*>.*?</tr>", h, re.S)
          eprows = [r for r in rows if "Number" in r]
          print(f"::notice title=afl rows::{len(rows)} rows, {len(eprows)} episode rows")
          for r in eprows[24:27]:
              print("::notice title=afl row::" + re.sub(r"\s+", " ", r)[:600])
          i = h.find("Filler Episodes")
          print("::notice title=afl summary::" + re.sub(r"\s+", " ", h[i-200:i+500]))
          s = get("https://www.animefillerlist.com/shows")
          links = re.findall(r'<a href="(/shows/[^"]+)"[^>]*>([^<]+)</a>', s)
          print(f"::notice title=afl shows::{len(links)} links; sample {links[:3]} ... {[l for l in links if 'one-piece' in l[0] or 'bleach' in l[0]][:3]}")
          j = s.find("/shows/naruto")
          print("::notice title=afl shows html::" + re.sub(r"\s+", " ", s[j-300:j+200]))
          try:
              print("::notice title=jikan::" + get("https://api.jikan.moe/v4/anime/20")[:100])
          except Exception as e:
              print(f"::notice title=jikan::still failing: {e}")

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests (offline; fake site, fake mpv, real ani-cli)
        run: pytest -q

      - name: Known vulnerabilities in dependencies
        if: runner.os == 'Linux'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
