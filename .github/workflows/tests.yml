name: tests

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

# Read-only: tests never need to change the repository.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      # ani-cli 5.1.6, the version AniGUI's parser is verified against
      ANI_CLI_COMMIT: 0301d67d5768d332b049821a30082ad43d9a215a
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install ani-cli (pinned)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://raw.githubusercontent.com/pystardust/ani-cli/$ANI_CLI_COMMIT/ani-cli" -o "$HOME/.local/bin/ani-cli"
          chmod +x "$HOME/.local/bin/ani-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Probe episode stills (temporary)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          python - <<'PY'
          import collections
          from core.anilist import AniListClient
          from core.stills import EpisodeStills
          from core.covers import _default_fetcher, image_extension
          src = EpisodeStills(AniListClient())
          shows = [("Frieren", 154587, 52991, 28), ("MHA S1", 21459, 31964, 13), ("One Piece", 21, 21, 60),
                   ("Naruto", 20, 20, 40), ("Demon Slayer", 101922, 38000, 26), ("JJK", 113415, 40748, 24),
                   ("Solo Leveling", 151807, 52299, 12), ("Bleach", 269, 269, 40), ("Chainsaw Man", 127230, 44511, 12)]
          for name, aid, mal, n in shows:
              found = src.for_episodes(aid, mal, [(str(i), None) for i in range(1, n + 1)])
              results = collections.Counter()
              bad = []
              for ep, url in found.items():
                  host = url.split("/")[2]
                  try:
                      data = _default_fetcher(url)
                      ok = bool(image_extension(data))
                      results[(host, "ok" if ok else "not-image")] += 1
                      if not ok: bad.append((ep, url[:90], data[:40]))
                  except Exception as e:
                      results[(host, "fail")] += 1
                      bad.append((ep, url[:90], str(e)[:80]))
              print(f"::notice title=stills {name}::{len(found)}/{n} found; {dict(results)}; bad: {bad[:3]}")
          PY

      - name: Run tests (offline; fake site, fake mpv, real ani-cli)
        run: pytest -q

      - name: Known vulnerabilities in dependencies
        if: runner.os == 'Linux'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
