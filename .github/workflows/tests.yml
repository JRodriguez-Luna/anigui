name: tests

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

# Read-only: tests never need to change the repository.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      # ani-cli 5.1.6, the version AniGUI's parser is verified against
      ANI_CLI_COMMIT: 0301d67d5768d332b049821a30082ad43d9a215a
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install ani-cli (pinned)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://raw.githubusercontent.com/pystardust/ani-cli/$ANI_CLI_COMMIT/ani-cli" -o "$HOME/.local/bin/ani-cli"
          chmod +x "$HOME/.local/bin/ani-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Probe stills for new shows (temporary)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from core import http
          from core.anilist import AniListClient
          from core.stills import EpisodeStills
          al = AniListClient(); src = EpisodeStills(al)
          for q in ("FX Fighter Kurumi-chan", "I'm Dating a Dark Summoner", "Frieren", "Solo Leveling"):
              m = al.search(q, per_page=1)[0]
              ours = src.for_episodes(m.anilist_id, m.mal_id, [(str(i), None) for i in range(1, 6)])
              se = al.streaming_episodes(m.anilist_id)
              r = http.request(f"https://api.ani.zip/mappings?anilist_id={m.anilist_id}", timeout=20)
              info = ""
              if r.status == 200:
                  d = json.loads(r.body); eps = d.get("episodes") or {}
                  imgs = {k: (v or {}).get("image") for k, v in eps.items()}
                  info = (f"anizip eps={len(eps)} with image={sum(1 for v in imgs.values() if v)} "
                          f"keys={list(eps)[:6]} ep1={json.dumps(eps.get('1'))[:300]}")
              else:
                  info = f"anizip HTTP {r.status} {r.body[:100]!r}"
              print(f"::notice title=new {q}::id={m.anilist_id} mal={m.mal_id} ours={len(ours)}/5 anilist_streaming={len(se)} | {info}")
          PY

      - name: Run tests (offline; fake site, fake mpv, real ani-cli)
        run: pytest -q

      - name: Known vulnerabilities in dependencies
        if: runner.os == 'Linux'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
