name: tests

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

# Read-only: tests never need to change the repository.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      # ani-cli 5.1.6, the version AniGUI's parser is verified against
      ANI_CLI_COMMIT: 0301d67d5768d332b049821a30082ad43d9a215a
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install ani-cli (pinned)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://raw.githubusercontent.com/pystardust/ani-cli/$ANI_CLI_COMMIT/ani-cli" -o "$HOME/.local/bin/ani-cli"
          chmod +x "$HOME/.local/bin/ani-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Probe ani.zip for shows without pictures (temporary)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from core import http
          from core.anilist import AniListClient
          al = AniListClient()
          want = ("Made in Abyss", "Laid-Off", "Ramparts of Ice", "Rascal Does Not", "Beerus", "Hello, I am a Witch", "Magic Repo Man")
          for m in al.season("FALL", 2026, per_page=30):
              if not any(w.lower() in m.display_title.lower() for w in want):
                  continue
              r = http.request(f"https://api.ani.zip/mappings?anilist_id={m.anilist_id}", timeout=20)
              if r.status != 200:
                  print(f"::notice title=az {m.display_title[:25]}::HTTP {r.status}"); continue
              d = json.loads(r.body); eps = d.get("episodes") or {}
              summ = [(k, (v or {}).get("episodeNumber"), (v or {}).get("absoluteEpisodeNumber"), bool((v or {}).get("image")), (v or {}).get("airDate")) for k, v in list(eps.items())[:8]]
              print(f"::notice title=az {m.display_title[:25]}::next_ep={m.next_episode} eps={len(eps)} mappings={json.dumps(d.get('mappings'))[:160]} first={summ}")
          PY

      - name: Run tests (offline; fake site, fake mpv, real ani-cli)
        run: pytest -q

      - name: Known vulnerabilities in dependencies
        if: runner.os == 'Linux'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
