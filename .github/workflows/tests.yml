name: tests

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

# Read-only: tests never need to change the repository.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      # ani-cli 5.1.6, the version AniGUI's parser is verified against
      ANI_CLI_COMMIT: 0301d67d5768d332b049821a30082ad43d9a215a
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install ani-cli (pinned)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://raw.githubusercontent.com/pystardust/ani-cli/$ANI_CLI_COMMIT/ani-cli" -o "$HOME/.local/bin/ani-cli"
          chmod +x "$HOME/.local/bin/ani-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Probe episode stills (temporary)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          python - <<'PY'
          from core.anilist import AniListClient
          from core.stills import EpisodeStills, titles_agree, number_key
          from core.hianime import HianimeClient
          hi = HianimeClient()
          src = EpisodeStills(AniListClient())
          shows = [("Frieren", 154587, 52991, "frieren"), ("Demon Slayer", 101922, 38000, "demon slayer kimetsu no yaiba"),
                   ("JJK", 113415, 40748, "jujutsu kaisen"), ("Naruto", 20, 20, "naruto"), ("Solo Leveling", 151807, 52299, "solo leveling"),
                   ("Chainsaw Man", 127230, 44511, "chainsaw man"), ("Bleach", 269, 269, "bleach")]
          for name, aid, mal, q in shows:
              try:
                  res = hi.search(q)[0]
                  eps = hi.episodes(res.anime_id)[:40]
              except Exception as e:
                  print(f"::notice title=titles {name}::hianime failed: {e}"); continue
              plain = src.for_episodes(aid, mal, [(e.number, None) for e in eps])
              titled = src.for_episodes(aid, mal, [(e.number, e.title) for e in eps])
              lost = [n for n in plain if n not in titled]
              ex = [(n, next(e.title for e in eps if e.number == n)) for n in lost[:3]]
              print(f"::notice title=titles {name}::{res.title!r}: {len(eps)} eps, {len(plain)} stills by number, "
                    f"{len(titled)} after title check; rejected {lost[:12]} e.g. {ex}")
          PY

      - name: Run tests (offline; fake site, fake mpv, real ani-cli)
        run: pytest -q

      - name: Known vulnerabilities in dependencies
        if: runner.os == 'Linux'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
