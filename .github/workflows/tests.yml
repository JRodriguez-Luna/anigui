name: tests

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

# Read-only: tests never need to change the repository.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      # ani-cli 5.1.6, the version AniGUI's parser is verified against
      ANI_CLI_COMMIT: 0301d67d5768d332b049821a30082ad43d9a215a
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install ani-cli (pinned)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://raw.githubusercontent.com/pystardust/ani-cli/$ANI_CLI_COMMIT/ani-cli" -o "$HOME/.local/bin/ani-cli"
          chmod +x "$HOME/.local/bin/ani-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Probe filler sources (temporary)
        continue-on-error: true
        run: |
          for u in "https://api.jikan.moe/v4/anime/20/episodes?page=1" "https://api.jikan.moe/v4/anime/20" "https://www.animefillerlist.com/shows/naruto"; do
            out=$(curl -sS -m 60 -A "AniGUI/1.7" -o /tmp/b -w "%{http_code} %{time_total}s %{remote_ip}" "$u" 2>&1 || true)
            echo "::notice title=probe ${{ runner.os }}::$u -> $out $(head -c 150 /tmp/b 2>/dev/null | tr -d '\n\r')"
          done
          grep -o 'class="filler"' /tmp/b | wc -l | xargs -I{} echo "::notice title=probe ${{ runner.os }}::animefillerlist filler rows: {}"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests (offline; fake site, fake mpv, real ani-cli)
        run: pytest -q

      - name: Known vulnerabilities in dependencies
        if: runner.os == 'Linux'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
