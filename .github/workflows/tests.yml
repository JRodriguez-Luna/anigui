name: tests

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

# Read-only: tests never need to change the repository.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      # ani-cli 5.1.6, the version AniGUI's parser is verified against
      ANI_CLI_COMMIT: 0301d67d5768d332b049821a30082ad43d9a215a
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install ani-cli (pinned)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://raw.githubusercontent.com/pystardust/ani-cli/$ANI_CLI_COMMIT/ani-cli" -o "$HOME/.local/bin/ani-cli"
          chmod +x "$HOME/.local/bin/ani-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Probe AniList tags (temporary)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from core import http
          q = """query($s:String){Page(perPage:1){media(type:ANIME,search:$s){id title{english romaji} genres isAdult
                 tags{name rank category isAdult isMediaSpoiler isGeneralSpoiler}}}}"""
          for s in ["I'm Dating a Dark Summoner", "Food Wars", "High School DxD", "Prison School", "My Dress-Up Darling",
                    "Chainsaw Man", "Attack on Titan", "Frieren", "Kaguya-sama Love is War", "Rent-a-Girlfriend",
                    "The Quintessential Quintuplets", "Interspecies Reviewers", "Redo of Healer", "Domestic Girlfriend",
                    "Jujutsu Kaisen", "Demon Slayer", "Goblin Slayer", "Berserk 1997", "Shimoneta", "To Love Ru",
                    "Toradora", "Spy x Family", "Highschool of the Dead", "Monster Musume", "Konosuba", "One Punch Man"]:
              r = http.request("https://graphql.anilist.co", data=json.dumps({"query": q, "variables": {"s": s}}).encode(),
                               headers={"Content-Type": "application/json"})
              m = json.loads(r.body)["data"]["Page"]["media"][0]
              tags = [f"{t['name']}:{t['rank']}{'*' if t['isAdult'] else ''}({t['category'].split('-')[-1]})"
                      for t in m["tags"] if t["category"].startswith(("Sexual", "Theme-Other", "Theme-Drama")) or t["isAdult"] or t["name"] in ("Gore", "Nudity", "Fan Service", "Violence", "Torture", "Suicide", "Body Horror")]
              print(f"::notice title=tags {s[:22]}::{(m['title']['english'] or m['title']['romaji'])[:30]} adult={m['isAdult']} genres={m['genres']} | {', '.join(tags)[:700]}")
          PY

      - name: Run tests (offline; fake site, fake mpv, real ani-cli)
        run: pytest -q

      - name: Known vulnerabilities in dependencies
        if: runner.os == 'Linux'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
