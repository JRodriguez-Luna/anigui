name: auto-release

# A new version number on main is a release. When main moves to a commit whose
# core/__init__.py version has no release yet, this runs the release workflow with
# that tag: build, the real-Mac checks, then it creates the GitHub Release (and tag).
#
# Publishing is not trusting: Update Now only installs a release once the
# publisher's Mac has signed it (core/signing.py), so this can't push an update to
# anyone on its own. If the release already exists, only its notes are brought in
# line with core/changelog.py (so a reworded What's New reaches the GitHub page too).

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      released: ${{ steps.v.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Is this version released yet?
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('core/__init__.py').read()).group(1))")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected version in core/__init__.py: $version"
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             || git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/v$version" >/dev/null; then
            echo "::notice title=auto-release::v$version is already released; checking its notes"
            echo "released=v$version" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=auto-release::Releasing v$version"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.check.outputs.tag }}

  notes:
    needs: check
    if: needs.check.outputs.released != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Match the release notes to core/changelog.py
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.released }}
        run: |
          python3 tools/release_notes.py "${TAG#v}" > notes.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > current.md
          if diff -q <(sed -e 's/[[:space:]]*$//' notes.md) <(sed -e 's/[[:space:]]*$//' current.md) >/dev/null; then
            echo "::notice title=auto-release::$TAG notes are up to date"
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            echo "::notice title=auto-release::$TAG notes updated from core/changelog.py"
          fi
