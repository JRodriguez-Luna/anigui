name: release

# Tag push (v1.2.3)   -> build AniGUI.app and publish a GitHub Release with the .dmg
#                        (also when the release + tag are created on github.com)
# Packaging changes    -> build only (catches a broken .app before release day)
on:
  push:
    tags: ["v*"]
    branches: [main, next]
    paths:
      - "packaging/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/release.yml"
      - "core/setup.py"
  workflow_dispatch:

# Nothing by default; the build job alone may write (to attach the .dmg to a release).
permissions:
  contents: read

jobs:
  build:
    name: AniGUI.app (Apple silicon)
    runs-on: macos-latest   # Apple silicon (arm64)
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Read version
        id: v
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('core/__init__.py').read()).group(1))")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match core/__init__.py version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: pip install -r requirements.txt "pyinstaller>=6.22" Pillow

      - name: Draw icon
        run: python packaging/make_icon.py

      - name: Build AniGUI.app
        env:
          ANIGUI_VERSION: ${{ steps.v.outputs.version }}
        run: pyinstaller --noconfirm --clean --log-level WARN --distpath dist --workpath build packaging/AniGUI.spec

      - name: Check the bundle
        run: |
          APP=dist/AniGUI.app
          "$APP/Contents/MacOS/AniGUI" --self-test
          codesign --verify --deep --strict "$APP" && echo "signature: ok (ad-hoc)"
          echo "arch: $(lipo -archs "$APP/Contents/MacOS/AniGUI")"
          echo "version: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          du -sh "$APP"

      - name: Build installer (.dmg)
        id: dmg
        run: |
          pip install "dmgbuild>=1.6"
          python packaging/make_dmg_background.py build
          tiffutil -cathidpicheck build/dmg-background.png build/dmg-background@2x.png -out build/dmg-background.tiff
          name="AniGUI-${{ steps.v.outputs.version }}-macOS-AppleSilicon.dmg"
          dmgbuild -s packaging/dmg_settings.py \
            -D app=dist/AniGUI.app -D background=build/dmg-background.tiff -D volicon=packaging/AniGUI.icns \
            "AniGUI" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - name: Check the installer
        run: |
          set +e
          DMG="${{ steps.dmg.outputs.name }}"
          fails=0
          check() {  # name, command; each result becomes a visible annotation
            if eval "$2"; then echo "::notice title=dmg::PASS $1"; else echo "::error title=dmg::FAIL $1"; fails=$((fails+1)); fi
          }
          check "hdiutil verify" 'hdiutil verify "$DMG" >/tmp/verify.txt 2>&1'
          MNT=$(mktemp -d)
          check "mounts" 'hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MNT" >/tmp/attach.txt 2>&1'
          echo "::notice title=dmg contents::$(ls -A "$MNT" 2>&1 | tr '\n' ' ') | .background: $(ls -A "$MNT/.background" 2>&1 | tr '\n' ' ')"
          check "AniGUI.app present" 'test -d "$MNT/AniGUI.app"'
          check "Applications link" '[ "$(readlink "$MNT/Applications")" = "/Applications" ]'
          check "window layout (.DS_Store)" 'test -f "$MNT/.DS_Store"'
          check "background image" 'ls "$MNT"/.background.tiff "$MNT"/.background/* >/dev/null 2>&1 || test -f "$MNT/.background.tiff"'
          check "app signature" 'codesign --verify --deep --strict "$MNT/AniGUI.app" >/tmp/cs.txt 2>&1'
          check "app self-test" '"$MNT/AniGUI.app/Contents/MacOS/AniGUI" --self-test >/tmp/st.txt 2>&1'
          [ "$fails" -gt 0 ] && echo "::notice title=details::verify: $(tail -c 300 /tmp/verify.txt | tr '\n' ' ') | attach: $(tail -c 300 /tmp/attach.txt | tr '\n' ' ') | codesign: $(tail -c 400 /tmp/cs.txt | tr '\n' ' ') | self-test: $(tail -c 400 /tmp/st.txt | tr '\n' ' ')"
          hdiutil detach "$MNT" >/dev/null 2>&1
          exit $fails

      - name: Setup assistant on a real Mac
        # Runs the same install code AniGUI's Setup button uses: pinned ani-cli (checksum
        # verified) into AniGUI's folder, IINA into /Applications, then the connection test.
        # The token only lifts GitHub's anonymous API limit, which shared runners often hit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          os.environ["ANIGUI_HOME"] = os.path.expanduser("~/anigui-ci")
          from core import ani_cli, setup, updates
          fails = 0
          def report(ok, msg):
              global fails
              fails += 0 if ok else 1
              print(f"::{'notice' if ok else 'error'} title=setup::{'PASS' if ok else 'FAIL'} {msg}")
          try:
              setup.install_ani_cli()
              path = ani_cli.find_ani_cli()
              version = ani_cli.ani_cli_version(path)
              report(version == setup.ANI_CLI_PIN_VERSION and path == str(setup.managed_ani_cli()),
                     f"ani-cli {version} installed at {path}")
          except Exception as exc:
              report(False, f"ani-cli install: {exc}")
          try:
              # The fallback users get when GitHub's API rate-limits them: must keep working
              tag, dmg = setup.latest_iina_web()
              report(dmg.endswith(".dmg") and tag in dmg, f"IINA via GitHub web pages: {tag} {dmg}")
          except Exception as exc:
              report(False, f"IINA web fallback: {exc}")
          try:
              import glob
              for existing in glob.glob("/Applications/IINA.app"):
                  print(f"::notice title=iina::Team of the IINA already on this Mac: {setup.signing_team(existing)}")
              app = setup.install_iina(progress=print)
              print(f"::notice title=iina::Installed IINA signed by team {setup.signing_team(app)}")
              found = setup.find_player("iina")
              report(bool(found) and (app / "Contents" / "MacOS" / "iina-cli").exists(), f"IINA installed at {app}; found {found}")
          except Exception as exc:
              report(False, f"IINA install: {exc}")
          status = setup.current_status()
          report(status.ready, f"Setup status ready={status.ready} ({status.ani_cli_version}, {status.player})")
          net = setup.check_network()
          print(f"::notice title=setup::network from GitHub's Mac: {net.state} ({net.message})")
          # Live services the v1.2 features depend on (real data, so a notice rather than a failure)
          from core import aniskip
          from core.anilist import AniListClient
          segs = aniskip.skip_times(52991, "1")   # Frieren episode 1 on MyAnimeList
          print(f"::notice title=aniskip::Frieren ep 1 skip times: {[(s.kind, s.start, s.end) for s in segs]}")
          airing = AniListClient().airing([154587, 21])   # Frieren, One Piece
          print(f"::notice title=anilist::airing: {[(m.display_title, m.status, m.next_episode) for m in airing.values()]}")
          report(bool(airing), "AniList airing lookup answered")
          from core import calendar as cal
          from core.catalog import Catalog
          from core.store import Store
          try:
              week = cal.build(Store(), Catalog(Store()), mine=False)
              top = sorted((e for d in week.days for e in d), key=lambda e: e.rank)[:5]
              report(week.count > 0, f"Trending calendar: {week.count} shows this week; top: "
                                     f"{[(e.rank, e.title, e.episode, e.when.strftime('%a %H:%M')) for e in top]}")
          except Exception as exc:
              import traceback
              report(False, f"Trending calendar: {type(exc).__name__}: {exc} | "
                            + " / ".join(traceback.format_exc().strip().splitlines()[-4:]))
          # Search filters with no genre (used to send genres=null, which AniList answers with HTTP 500)
          try:
              found = AniListClient().browse(year=2025, sort="POPULARITY_DESC", per_page=5)
              report(bool(found), f"Search filters, year only: {[m.display_title for m in found]}")
          except Exception as exc:
              report(False, f"Search filters, year only: {exc}")
          upd = updates.check_ani_cli(setup.ANI_CLI_PIN_VERSION)
          print(f"::notice title=setup::ani-cli update check: {'none' if upd is None else upd.latest}")
          raise SystemExit(fails)
          PY

      - name: Update Now on a real Mac
        # The same code the Update Now button runs: download (file:// here), verify the
        # checksum, mount, check the signature and version, swap, against a copy of the app.
        run: |
          DMG="${{ steps.dmg.outputs.name }}"
          shasum -a 256 "$DMG" > "$DMG.sha256"
          mkdir -p "$RUNNER_TEMP/Apps" && ditto dist/AniGUI.app "$RUNNER_TEMP/Apps/AniGUI.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.0.1" "$RUNNER_TEMP/Apps/AniGUI.app/Contents/Info.plist"
          python - <<PY
          import pathlib
          from core import self_update, updates
          dmg = pathlib.Path("$DMG").resolve()
          app = pathlib.Path("$RUNNER_TEMP/Apps/AniGUI.app")
          upd = updates.AppUpdate("0.0.1", "${{ steps.v.outputs.version }}", "", "", dmg_url=dmg.as_uri(),
                                  sha256_url=pathlib.Path(f"{dmg}.sha256").as_uri())
          stages = []
          def fetch(url):
              return pathlib.Path(url.removeprefix("file://")).read_bytes()
          self_update.download_and_install(upd, app, stage=stages.append, fetch=fetch, keys=())  # mechanics only
          version = self_update.bundle_version(app)
          leftovers = [p.name for p in app.parent.iterdir() if p.name != "AniGUI.app"]
          ok = version == "${{ steps.v.outputs.version }}" and not leftovers
          print(f"::{'notice' if ok else 'error'} title=update::{'PASS' if ok else 'FAIL'} installed {version}, "
                f"stages {stages}, leftovers {leftovers}")
          # Signed updates (with a throwaway key; the real key never leaves the publisher's Mac)
          from core import signing
          from core.self_update import sha256_of
          test_key = signing.new_private_key()
          test_pub = signing.public_key_of(test_key)
          sig = pathlib.Path(f"{dmg}.sig")
          sig.write_text(signing.sign(test_key, "${{ steps.v.outputs.version }}", sha256_of(dmg)))
          signed = upd.__class__(**{**upd.__dict__, "sig_url": sig.as_uri()})
          self_update.download_and_install(signed, app, fetch=fetch, keys=(test_pub,))
          print("::notice title=update::PASS signed update installed")
          try:
              self_update.download_and_install(signed, app, fetch=fetch, keys=(signing.public_key_of(signing.new_private_key()),))
              print("::error title=update::FAIL an update signed by another key was installed")
              ok = False
          except self_update.UpdateError as exc:
              print(f"::notice title=update::PASS other key refused: {exc}")
          from core import setup as st
          try:
              v, script = st.latest_ani_cli()
              print(f"::notice title=ani-cli::PASS latest tagged release: {v} ({len(script)} bytes)")
          except Exception as exc:
              print(f"::error title=ani-cli::FAIL latest tagged release: {exc}")
              ok = False
          bad = upd.__class__(**{**upd.__dict__, "sha256": "0" * 64})
          try:
              self_update.download_and_install(bad, app, fetch=fetch, keys=())
              print("::error title=update::FAIL a wrong checksum was installed")
              ok = False
          except self_update.UpdateError as exc:
              print(f"::notice title=update::PASS wrong checksum refused: {exc}")
          raise SystemExit(0 if ok else 1)
          PY
          codesign --verify --deep --strict "$RUNNER_TEMP/Apps/AniGUI.app" && "$RUNNER_TEMP/Apps/AniGUI.app/Contents/MacOS/AniGUI" --self-test

      - name: Episode stills on a real network
        # External data, so a miss is a warning, not a failed release.
        run: |
          python - <<'PY'
          from core.anilist import AniListClient
          from core.stills import EpisodeStills
          src = EpisodeStills(AniListClient())
          # (name, AniList id, MAL id, episodes, at least this many stills)
          for name, aid, mal, count, want in (("Frieren", 154587, 52991, 28, 20),
                                              ("My Hero Academia S1", 21459, 31964, 13, 10)):
              found = src.for_episodes(aid, mal, [(str(n), None) for n in range(1, count + 1)])
              level = "notice" if len(found) >= want else "warning"
              hosts = sorted({u.split("/")[2] for u in found.values()})
              print(f"::{level} title=stills::{'PASS' if level == 'notice' else 'LOW'} {name}: "
                    f"{len(found)}/{count} episodes have stills (from {', '.join(hosts) or 'nowhere'})")
          from core.fillers import FillerGuide
          guide = FillerGuide()
          numbers = [str(n) for n in range(1, 221)]
          for name, titles, want in (("Naruto", ["Naruto"], 60), ("Naruto Shippuden", ["Naruto: Shippuden"], 100),
                                     ("Frieren", ["Frieren: Beyond Journey's End", "Sousou no Frieren"], 0)):
              info = guide.for_titles(titles)
              count = len(info.kinds)
              ok = count >= want and (want or not count)
              print(f"::{'notice' if ok else 'warning'} title=fillers::{'PASS' if ok else 'CHECK'} {name}: "
                    f"{count} fillers (complete={info.complete}), {info.summary(numbers)}; "
                    f"first: {sorted(info.kinds, key=float)[:6]}")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.name }}
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What's new (from core/changelog.py, the same text as the in-app window), then install steps
          python -c "from core import changelog; r = changelog.RELEASES[0]; print('## What\'s new\n'); [print(f'- **{c.title}:** {c.text}') for c in r.changes]; print()" > notes.md
          sed "s/{{VERSION}}/${{ steps.v.outputs.version }}/g" packaging/RELEASE_NOTES.md >> notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release was created on github.com (which made the tag): attach the .dmg and fill in the notes
            gh release upload "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.name }}" "${{ steps.dmg.outputs.name }}.sha256" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "AniGUI $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.name }}" "${{ steps.dmg.outputs.name }}.sha256" \
              --title "AniGUI $GITHUB_REF_NAME" --notes-file notes.md
          fi
